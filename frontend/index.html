<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sokoban</title>
<style>
  :root {
    --bg: #0c0e13;
    --surface: #161922;
    --surface-2: #1d212c;
    --surface-3: #252b38;
    --border: #2a3040;
    --border-2: #3a4254;
    --ink: #eef2f8;
    --muted: #98a3b6;
    --brand: #6c8cff;
    --brand-2: #8aa2ff;
    --low: #5b8c5a; --high: #b08a4f; --box: #7a4a22;
    --player: #2f6fed; --accent: #ffd166;
    --radius: 12px;
    --radius-lg: 16px;
    --shadow: 0 8px 24px rgba(0,0,0,.35);
    --shadow-sm: 0 2px 8px rgba(0,0,0,.25);
    --ease: 160ms cubic-bezier(.4,0,.2,1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    height: 100vh; color: var(--ink);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 14px; line-height: 1.45; letter-spacing: .1px;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(108,140,255,.10), transparent 60%),
      radial-gradient(900px 500px at 110% 10%, rgba(255,209,102,.06), transparent 55%),
      var(--bg);
    display: grid; grid-template-rows: auto auto 1fr auto;
    gap: 12px; padding: 16px 18px 18px;
  }

  /* ---- header ---- */
  header { display: flex; align-items: center; gap: 14px; }
  .logo {
    width: 34px; height: 34px; border-radius: 9px; flex: none;
    background: linear-gradient(145deg, var(--brand), #4c6ef5);
    box-shadow: 0 4px 14px rgba(76,110,245,.45), inset 0 1px 0 rgba(255,255,255,.25);
    position: relative;
  }
  .logo::after {
    content: ""; position: absolute; inset: 9px; border-radius: 3px;
    background: rgba(255,255,255,.92);
    box-shadow: 0 0 0 2px rgba(0,0,0,.15);
  }
  header h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.2px; }
  header small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 1px; }

  /* ---- toolbar ---- */
  .bar {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    background: linear-gradient(180deg, var(--surface-2), var(--surface));
    border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 10px 12px; box-shadow: var(--shadow-sm);
  }

  button, select {
    background: var(--surface-3); color: var(--ink);
    border: 1px solid var(--border-2); border-radius: 10px;
    padding: 8px 13px; font-size: 13.5px; font-weight: 500; font-family: inherit;
    cursor: pointer; transition: background var(--ease), border-color var(--ease), transform var(--ease), box-shadow var(--ease);
  }
  button:hover, select:hover { border-color: var(--brand); background: #2b3240; }
  button:active { transform: translateY(1px); }
  button:focus-visible, select:focus-visible, input:focus-visible {
    outline: none; box-shadow: 0 0 0 3px rgba(108,140,255,.4); border-color: var(--brand);
  }
  button.active {
    background: linear-gradient(180deg, var(--brand-2), var(--brand));
    color: #0c0e13; border-color: transparent; font-weight: 700;
    box-shadow: 0 4px 12px rgba(108,140,255,.4);
  }
  select { appearance: none; padding-right: 28px;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 15px) center, calc(100% - 10px) center;
    background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
  }

  /* segmented control */
  .seg { display: inline-flex; gap: 3px; padding: 3px; background: rgba(0,0,0,.28);
         border: 1px solid var(--border); border-radius: 12px; }
  .seg button { padding: 6px 14px; border: 1px solid transparent; background: transparent; color: var(--muted); }
  .seg button:hover { background: rgba(255,255,255,.05); color: var(--ink); }
  .seg button.active { color: #0c0e13; }

  .icon-btn { padding: 8px 11px; }

  #hud {
    font-weight: 600; font-size: 13px; padding: 7px 14px; border-radius: 10px;
    background: rgba(0,0,0,.28); border: 1px solid var(--border); white-space: nowrap;
    transition: background var(--ease), color var(--ease);
  }
  #hud.win { background: #1f7a4d; border-color: #2b9d63; }
  #hud.fail { background: #8a2f2f; border-color: #b14040; }
  #hud.invalid { background: #6b4a1f; border-color: #9a6c2c; }

  .badge { padding: 3px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 700; letter-spacing: .3px; text-transform: uppercase; }
  .badge.low { background: var(--low); } .badge.high { background: var(--high); }
  .ctl { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12.5px; }
  .sep { width: 1px; align-self: stretch; background: var(--border); margin: 2px 4px; }
  .spacer { flex: 1; }

  /* range slider */
  input[type=range] {
    -webkit-appearance: none; appearance: none; height: 5px; width: 92px;
    border-radius: 999px; background: var(--border-2); cursor: pointer; outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 15px; height: 15px; border-radius: 50%;
    background: var(--brand); border: 2px solid var(--bg); box-shadow: 0 1px 4px rgba(0,0,0,.5);
  }
  input[type=range]::-moz-range-thumb {
    width: 15px; height: 15px; border: 2px solid var(--bg); border-radius: 50%; background: var(--brand);
  }

  /* ---- stage ---- */
  .stage { min-height: 0; display: grid; gap: 12px; }
  .stage.mode-2d { grid-template-columns: 1fr; }
  .stage.mode-3d { grid-template-columns: 1fr; }
  .stage.mode-split { grid-template-columns: 1fr 1fr; }
  .stage.mode-2d #panel3d, .stage.mode-3d #panel2d { display: none; }
  .panel {
    min-width: 0; min-height: 0; position: relative; overflow: hidden;
    border: 1px solid var(--border); border-radius: var(--radius-lg);
    background:
      radial-gradient(120% 90% at 50% 0%, rgba(108,140,255,.06), transparent 60%),
      #0a0d13;
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.03);
    display: flex; align-items: center; justify-content: center;
  }
  .panel::after {
    content: attr(data-label); position: absolute; top: 10px; left: 12px;
    font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    color: var(--muted); opacity: .55; pointer-events: none;
  }
  #viewport { position: relative; width: 100%; height: 100%; }
  #viewport canvas { display: block; }

  #board { position: relative; }
  /* static terrain tiles: edge-to-edge, separated only by a faint inset line */
  .t2d { position: absolute; box-sizing: border-box; }
  .t2d.low { background: var(--low); box-shadow: inset 0 0 0 1px rgba(0,0,0,.13); }
  .t2d.high { background: var(--high); box-shadow: inset 0 3px 0 rgba(255,255,255,.16), inset 0 -4px 6px rgba(0,0,0,.32), inset 0 0 0 1px rgba(0,0,0,.2); }
  .t2d.goal { outline: 2px dashed var(--accent); outline-offset: -4px; }
  /* moving entities (absolutely positioned, slide via transform transitions) */
  .e2d { position: absolute; left: 0; top: 0; will-change: transform; }
  .box2d {
    background: linear-gradient(160deg, #8a5628, var(--box)); border-radius: 7px;
    box-shadow: inset 0 4px 0 rgba(255,255,255,.16), inset 0 -6px 9px rgba(0,0,0,.42), 0 3px 6px rgba(0,0,0,.45);
    z-index: 2;
  }
  .box2d.onhigh { background: linear-gradient(160deg, #6e451f, #5e3a1b); }
  .player2d {
    border-radius: 50%; z-index: 3;
    background: radial-gradient(circle at 35% 30%, #8fb2ff, var(--player));
    box-shadow: 0 3px 8px rgba(0,0,0,.55), 0 0 0 2px rgba(143,178,255,.25);
  }
  .player2d.phigh { background: radial-gradient(circle at 35% 30%, #dfeaff, #7fb0ff); }
  .ramp2d {
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, #7c8898, #6b7785); color: #161c26; font-weight: 800; border-radius: 6px; z-index: 1;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.2), 0 2px 4px rgba(0,0,0,.4);
  }

  /* ---- trajectory bar ---- */
  .traj {
    display: flex; gap: 10px; align-items: center;
    background: linear-gradient(180deg, var(--surface-2), var(--surface));
    border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 10px 12px; box-shadow: var(--shadow-sm);
  }
  .traj textarea {
    flex: 1; height: 38px; min-height: 38px; resize: vertical;
    background: rgba(0,0,0,.3); color: var(--ink);
    border: 1px solid var(--border-2); border-radius: 10px; padding: 9px 12px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px;
    transition: border-color var(--ease), box-shadow var(--ease);
  }
  .traj textarea::placeholder { color: #66718a; }
  .hint { color: var(--muted); font-size: 12px; }
  kbd { background: var(--surface-3); border: 1px solid var(--border-2); border-bottom-width: 2px;
        border-radius: 5px; padding: 1px 5px; font-size: 11px; font-family: ui-monospace, monospace; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js"
  }
}
</script>
</head>
<body>
  <header>
    <div class="logo" aria-hidden="true"></div>
    <div>
      <h1>Sokoban</h1>
      <small>Move with <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> or <kbd>WASD</kbd> · climb ramps, push boxes (even off ledges) or stand on top of them, reach the goal · paste a trajectory and Play to replay a run</small>
    </div>
  </header>

  <div class="bar">
    <span id="hud">loading…</span>
    <span class="seg" role="group" aria-label="View mode">
      <button data-mode="2d">2D</button>
      <button data-mode="3d">3D</button>
      <button data-mode="split">Split</button>
    </span>
    <span class="sep"></span>
    <select id="mapSelect" aria-label="Choose map"></select>
    <button id="prev" class="icon-btn" aria-label="Previous map">◀</button>
    <button id="next" class="icon-btn" aria-label="Next map">▶</button>
    <button id="reset">⟲ Reset</button>
    <button id="undo">↶ Undo</button>
    <span class="spacer"></span>
    <button id="play">▶ Play</button>
    <button id="step">⏭ Step</button>
    <span class="ctl">speed <input id="speed" type="range" min="0.5" max="4" step="0.5" value="1" /> <span id="speedVal">1x</span></span>
    <span class="sep"></span>
    <span class="ctl">player <span id="elev" class="badge low">low</span></span>
  </div>

  <div id="stage" class="stage mode-2d">
    <div id="panel2d" class="panel" data-label="2D"><div id="board"></div></div>
    <div id="panel3d" class="panel" data-label="3D"><div id="viewport"></div></div>
  </div>

  <div class="traj">
    <textarea id="traj" placeholder='Paste a trajectory to replay, e.g. ["S","E","N","E"]  or  S E N E'></textarea>
    <button id="playTraj">Play trajectory</button>
    <span class="hint">3D needs WebGL; if it fails the 2D view still works.</span>
  </div>

  <script src="maps.js"></script>
  <script src="game.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
