<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mountain Sokoban</title>
<style>
  :root {
    --bg: #1b2430; --panel: #243140; --ink: #e7eef6; --muted: #9fb2c5;
    --low: #5b8c5a; --high: #b08a4f; --wall: #131a22;
    --player: #2f6fed; --box: #7a4a22; --accent: #ffd166;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font-family: "Segoe UI", system-ui, sans-serif;
    display: grid; grid-template-rows: auto auto 1fr auto; height: 100vh;
  }
  header { padding: 12px 16px 2px; }
  header h1 { margin: 0; font-size: 19px; }
  header small { color: var(--muted); font-size: 12.5px; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 16px; }
  #hud { font-weight: 600; padding: 5px 12px; border-radius: 8px; background: var(--panel); }
  #hud.win { background: #1f7a4d; } #hud.fail { background: #8a2f2f; } #hud.invalid { background: #6b4a1f; }
  button, select, input[type=range] {
    background: var(--panel); color: var(--ink); border: 1px solid #34465a;
    border-radius: 8px; padding: 7px 11px; font-size: 14px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.active { background: var(--accent); color: #1b2430; border-color: var(--accent); font-weight: 700; }
  .seg { display: inline-flex; gap: 4px; padding: 3px; background: #1a232e; border-radius: 10px; }
  .seg button { padding: 6px 12px; }
  .badge { padding: 3px 9px; border-radius: 6px; font-size: 12px; font-weight: 700; }
  .badge.low { background: var(--low); } .badge.high { background: var(--high); }
  .spacer { flex: 1; }

  /* stage: 2D panel + 3D panel, layout driven by mode class */
  .stage { min-height: 0; display: grid; gap: 10px; padding: 0 16px; }
  .stage.mode-2d { grid-template-columns: 1fr; }
  .stage.mode-3d { grid-template-columns: 1fr; }
  .stage.mode-split { grid-template-columns: 1fr 1fr; }
  .stage.mode-2d #panel3d, .stage.mode-3d #panel2d { display: none; }
  .panel { min-width: 0; min-height: 0; background: #0e141b; border-radius: 10px; overflow: hidden;
           display: flex; align-items: center; justify-content: center; }
  #viewport { position: relative; width: 100%; height: 100%; }
  #viewport canvas { display: block; }

  #board { display: grid; gap: 2px; }
  .tile { display: flex; align-items: center; justify-content: center; border-radius: 4px; position: relative; line-height: 1; user-select: none; }
  .low { background: var(--low); }
  .high { background: var(--high); box-shadow: inset 0 3px 0 rgba(255,255,255,.18), inset 0 -4px 6px rgba(0,0,0,.35); }
  .wall { background: var(--wall); }
  .goal { outline: 2px dashed var(--accent); outline-offset: -4px; }
  .player { color: var(--player); text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .player.phigh { color: #7fb0ff; }
  .box { color: var(--box); filter: drop-shadow(0 2px 1px rgba(0,0,0,.5)); }
  .box.onhigh { color: #4a2c12; }
  .ramp { color: #2a2a2a; font-weight: 700; opacity: .85; }
  .goalring { color: var(--accent); opacity: .9; }

  .traj { display: flex; gap: 8px; align-items: center; padding: 8px 16px 12px; }
  .traj textarea {
    flex: 1; height: 34px; resize: vertical; background: var(--panel); color: var(--ink);
    border: 1px solid #34465a; border-radius: 8px; padding: 7px 10px; font-family: ui-monospace, monospace; font-size: 13px;
  }
  .hint { color: var(--muted); font-size: 12px; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js"
  }
}
</script>
</head>
<body>
  <header>
    <h1>Mountain Sokoban</h1>
    <small>Move with arrow keys / WASD · climb ramps, push boxes (even off ledges), reach the goal · watch a solution play out</small>
  </header>

  <div class="bar">
    <span id="hud">loading…</span>
    <span class="seg">
      <button data-mode="2d">2D</button>
      <button data-mode="3d">3D</button>
      <button data-mode="split">Split</button>
    </span>
    <select id="mapSelect" aria-label="Choose map"></select>
    <button id="prev">◀</button>
    <button id="next">▶</button>
    <button id="reset">⟲ Reset</button>
    <button id="undo">↶ Undo</button>
    <span class="spacer"></span>
    <button id="solve">★ Solve &amp; play</button>
    <button id="play">▶ Play</button>
    <button id="step">⏭ Step</button>
    <label class="hint">speed <input id="speed" type="range" min="0.5" max="4" step="0.5" value="1" style="width:90px" /></label>
    <span id="speedVal" class="hint">1x</span>
    <span>player: <span id="elev" class="badge low">low</span></span>
  </div>

  <div id="stage" class="stage mode-2d">
    <div id="panel2d" class="panel"><div id="board"></div></div>
    <div id="panel3d" class="panel"><div id="viewport"></div></div>
  </div>

  <div class="traj">
    <textarea id="traj" placeholder='Paste a trajectory to replay, e.g. ["S","E","N","E"]  or  S E N E'></textarea>
    <button id="playTraj">Play trajectory</button>
    <span class="hint">3D needs WebGL; if it fails the 2D view still works.</span>
  </div>

  <script src="maps.js"></script>
  <script src="game.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
