<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sokoban</title>
<style>
  :root {
    --bg: #0c0e13; --surface: #161922; --surface-2: #1d212c; --surface-3: #252b38;
    --border: #2a3040; --border-2: #3a4254;
    --ink: #eef2f8; --muted: #98a3b6; --brand: #6c8cff; --brand-2: #8aa2ff;
    --low: #5b8c5a; --high: #b08a4f; --box: #7a4a22; --player: #2f6fed; --accent: #ffd166;
    --radius-lg: 16px;
    --shadow: 0 8px 24px rgba(0,0,0,.35); --shadow-sm: 0 2px 8px rgba(0,0,0,.25);
    --ease: 160ms cubic-bezier(.4,0,.2,1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    height: 100vh; color: var(--ink); overflow: hidden;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 14px; line-height: 1.45;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(108,140,255,.10), transparent 60%),
      radial-gradient(900px 500px at 110% 10%, rgba(255,209,102,.06), transparent 55%),
      var(--bg);
    display: grid; grid-template-rows: auto auto 1fr var(--pane-h, 168px); gap: 12px; padding: 16px 18px 14px;
  }

  /* header */
  header { display: flex; align-items: center; gap: 14px; }
  .logo {
    width: 34px; height: 34px; border-radius: 9px; flex: none; position: relative;
    background: linear-gradient(145deg, var(--brand), #4c6ef5);
    box-shadow: 0 4px 14px rgba(76,110,245,.45), inset 0 1px 0 rgba(255,255,255,.25);
  }
  .logo::after { content: ""; position: absolute; inset: 9px; border-radius: 3px; background: rgba(255,255,255,.92); }
  header h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.2px; }
  header small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 1px; }

  /* toolbar */
  .bar {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    background: linear-gradient(180deg, var(--surface-2), var(--surface));
    border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 10px 12px; box-shadow: var(--shadow-sm);
  }
  button, select {
    background: var(--surface-3); color: var(--ink); border: 1px solid var(--border-2);
    border-radius: 10px; padding: 8px 13px; font-size: 13.5px; font-weight: 500; font-family: inherit;
    cursor: pointer; transition: background var(--ease), border-color var(--ease), transform var(--ease), box-shadow var(--ease);
  }
  button:hover, select:hover { border-color: var(--brand); background: #2b3240; }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .45; cursor: default; transform: none; }
  button:focus-visible, select:focus-visible, input:focus-visible {
    outline: none; box-shadow: 0 0 0 3px rgba(108,140,255,.4); border-color: var(--brand);
  }
  button.active {
    background: linear-gradient(180deg, var(--brand-2), var(--brand));
    color: #0c0e13; border-color: transparent; font-weight: 700; box-shadow: 0 4px 12px rgba(108,140,255,.4);
  }
  select { appearance: none; padding-right: 28px;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 15px) center, calc(100% - 10px) center;
    background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
  }
  .seg { display: inline-flex; gap: 3px; padding: 3px; background: rgba(0,0,0,.28); border: 1px solid var(--border); border-radius: 12px; }
  .seg button { padding: 6px 14px; border: 1px solid transparent; background: transparent; color: var(--muted); }
  .seg button:hover { background: rgba(255,255,255,.05); color: var(--ink); }
  .seg button.active { color: var(--ink); }   /* keep the highlight, don't flip the text color */
  .icon-btn { padding: 8px 11px; }
  input[type=file] { font-size: 12.5px; color: var(--muted); max-width: 196px; }
  input[type=file]::file-selector-button {
    background: var(--surface-3); color: var(--ink); border: 1px solid var(--border-2);
    border-radius: 9px; padding: 6px 10px; margin-right: 8px; cursor: pointer; font-size: 12.5px;
  }
  input[type=file]::file-selector-button:hover { border-color: var(--brand); }

  #hud {
    font-weight: 600; font-size: 13px; padding: 7px 14px; border-radius: 10px;
    background: rgba(0,0,0,.28); border: 1px solid var(--border); white-space: nowrap;
    transition: background var(--ease);
  }
  #hud.win { background: #1f7a4d; border-color: #2b9d63; }
  #hud.fail { background: #8a2f2f; border-color: #b14040; }
  .badge { padding: 3px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 700; letter-spacing: .3px; text-transform: uppercase; }
  .badge.low { background: var(--low); } .badge.high { background: var(--high); }
  .ctl { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12.5px; }
  .sep { width: 1px; align-self: stretch; background: var(--border); margin: 2px 4px; }
  .spacer { flex: 1; }
  input[type=range] {
    -webkit-appearance: none; appearance: none; height: 5px; width: 90px;
    border-radius: 999px; background: var(--border-2); cursor: pointer; outline: none;
  }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; border-radius: 50%; background: var(--brand); border: 2px solid var(--bg); }
  input[type=range]::-moz-range-thumb { width: 15px; height: 15px; border: 2px solid var(--bg); border-radius: 50%; background: var(--brand); }

  /* stage */
  .stage { min-height: 0; display: grid; gap: 12px; }
  .stage.mode-2d, .stage.mode-3d { grid-template-columns: 1fr; }
  .stage.mode-split { grid-template-columns: var(--col2d, 1fr) 10px 1fr; }
  .stage.mode-2d #panel3d, .stage.mode-3d #panel2d { display: none; }

  /* drag-to-resize handles (clamped to minimum sizes in resize.js) */
  #colResizer { display: none; }
  .stage.mode-split #colResizer { display: block; }
  .col-resizer { position: relative; cursor: col-resize; border-radius: 6px; touch-action: none; }
  .col-resizer::before { content: ""; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%,-50%); width: 4px; height: 48px; border-radius: 3px;
    background: var(--border-2); transition: background var(--ease), height var(--ease); }
  .col-resizer:hover::before, .col-resizer.dragging::before { background: var(--brand); height: 72px; }
  .row-resizer { flex: none; height: 10px; cursor: row-resize; position: relative;
    margin: -2px 0 2px; touch-action: none; }
  .row-resizer::before { content: ""; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%,-50%); width: 48px; height: 4px; border-radius: 3px;
    background: var(--border-2); transition: background var(--ease), width var(--ease); }
  .row-resizer:hover::before, .row-resizer.dragging::before { background: var(--brand); width: 72px; }
  .panel {
    min-width: 0; min-height: 0; position: relative; overflow: hidden;
    border: 1px solid var(--border); border-radius: var(--radius-lg);
    background: radial-gradient(120% 90% at 50% 0%, rgba(108,140,255,.06), transparent 60%), #0a0d13;
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.03);
    display: flex; align-items: center; justify-content: center;
  }
  .panel::after {
    content: attr(data-label); position: absolute; top: 10px; left: 12px;
    font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); opacity: .55; pointer-events: none;
  }
  #viewport { position: relative; width: 100%; height: 100%; }
  #viewport canvas { display: block; }

  #board { position: relative; }
  .t2d { position: absolute; box-sizing: border-box; }
  .t2d.low { background: var(--low); box-shadow: inset 0 0 0 1px rgba(0,0,0,.13); }
  .t2d.high { background: var(--high); box-shadow: inset 0 3px 0 rgba(255,255,255,.16), inset 0 -4px 6px rgba(0,0,0,.32), inset 0 0 0 1px rgba(0,0,0,.2); }
  .t2d.goal { outline: 2px dashed var(--accent); outline-offset: -4px; }
  .e2d { position: absolute; left: 0; top: 0; will-change: transform; }
  .box2d {
    background: linear-gradient(160deg, #8a5628, var(--box)); border-radius: 7px;
    box-shadow: inset 0 4px 0 rgba(255,255,255,.16), inset 0 -6px 9px rgba(0,0,0,.42), 0 3px 6px rgba(0,0,0,.45); z-index: 2;
  }
  .box2d.onhigh { background: linear-gradient(160deg, #6e451f, #5e3a1b); }
  .player2d { z-index: 3; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #8fb2ff, var(--player));
    box-shadow: 0 3px 8px rgba(0,0,0,.55), 0 0 0 2px rgba(143,178,255,.25); }
  .player2d.phigh { background: radial-gradient(circle at 35% 30%, #dfeaff, #7fb0ff); }
  .player2d:has(.player2d-core) { background: none; box-shadow: none; }
  .player2d-core {
    width: 100%; height: 100%; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #8fb2ff, var(--player));
    box-shadow: 0 3px 8px rgba(0,0,0,.55), 0 0 0 2px rgba(143,178,255,.25);
  }
  .player2d.phigh .player2d-core { background: radial-gradient(circle at 35% 30%, #dfeaff, #7fb0ff); }
  .player2d-core.bumping {
    background: radial-gradient(circle at 35% 30%, #e29393, #c25a5a) !important;
    box-shadow: 0 3px 10px rgba(190,80,80,.45), 0 0 0 2px rgba(206,120,120,.38) !important;
  }
  .ramp2d {
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, #7c8898, #6b7785); color: #161c26; font-weight: 800; border-radius: 6px; z-index: 1;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.2), 0 2px 4px rgba(0,0,0,.4);
  }

  /* replay detail strip (below the stage) */
  .pane {
    background: linear-gradient(180deg, var(--surface-2), var(--surface));
    border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 10px 14px; box-shadow: var(--shadow-sm);
    overflow-y: auto; min-height: 0;
    display: flex; flex-direction: column; gap: 8px;
  }
  .replay-foot { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .status { padding: 4px 11px; border-radius: 8px; background: rgba(0,0,0,.28); border: 1px solid var(--border); font-size: 12.5px; font-weight: 600; }
  .status.win  { background: #1f7a4d; border-color: #2b9d63; }
  .status.fail { background: #8a2f2f; border-color: #b14040; }
  .legend { color: var(--muted); font-size: 12px; }
  .legend code, kbd { background: var(--surface-3); border: 1px solid var(--border-2); border-radius: 5px; padding: 1px 6px; font-family: ui-monospace, monospace; font-size: 11.5px; }
  #replayAction { font-size: 13.5px; }
  #replayInfo { color: var(--muted); font-size: 12px; }
  #replayThink {
    width: 100%; flex: 1 1 auto; min-height: 44px; resize: none;
    background: rgba(0,0,0,.3); color: var(--ink); border: 1px solid var(--border-2); border-radius: 10px;
    padding: 8px 11px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px;
  }
  .hint { color: var(--muted); font-size: 12px; }

  /* confetti (2D) + end-of-level popup */
  .confetti2d { position: absolute; border-radius: 2px; pointer-events: none; z-index: 6; }
  #resultPopup {
    position: fixed; left: 50%; top: 42%; transform: translate(-50%,-50%) scale(.85);
    padding: 16px 36px; border-radius: 16px; font-size: 26px; font-weight: 800; text-align: center;
    background: rgba(18,21,29,.94); border: 1px solid var(--border-2); box-shadow: var(--shadow);
    opacity: 0; pointer-events: none; z-index: 60;
    transition: opacity .28s var(--ease), transform .28s var(--ease);
  }
  #resultPopup.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  #resultPopup.win  { color: #7fe0a6; border-color: #2b9d63; box-shadow: 0 0 44px rgba(43,157,99,.45), var(--shadow); }
  #resultPopup.fail { color: #ff9a9a; border-color: #b14040; box-shadow: 0 0 44px rgba(177,64,64,.4), var(--shadow); }
</style>
<script type="importmap">
{
  "imports": { "three": "./vendor/three.module.js" }
}
</script>
</head>
<body>
  <header>
    <div class="logo" aria-hidden="true"></div>
    <div>
      <h1>Sokoban</h1>
      <small>Load a Mesocosm run export and watch the agent play it back — step through with <kbd>←</kbd> <kbd>→</kbd> or auto-play. Toggle 2D / 3D / Split.</small>
    </div>
  </header>

  <div class="bar">
    <span id="hud">load a run export…</span>
    <span class="seg" role="group" aria-label="View mode">
      <button data-mode="2d">2D</button>
      <button data-mode="3d">3D</button>
      <button data-mode="split">Split</button>
    </span>
    <span class="sep"></span>
    <input type="file" id="replayFile" accept=".json" aria-label="Load run export" />
    <select id="replayEpSel" aria-label="Episode"><option>— load a run export —</option></select>
    <span class="sep"></span>
    <button id="replayPlayBtn">▶ Play</button>
    <button id="replayAutoBtn">⏭ Auto-play</button>
    <button id="replayPrev" class="icon-btn" title="Previous move">◀ Move</button>
    <button id="replayNext" class="icon-btn" title="Next move">Move ▶</button>
    <span class="ctl">speed <input id="replaySpeed" type="range" min="0.5" max="8" step="0.5" value="2" /> <span id="replaySpeedVal">2x</span></span>
    <button id="replayLevelPrev" class="icon-btn" title="Previous level">◀ Level</button>
    <button id="replayLevelNext" class="icon-btn" title="Next level">Level ▶</button>
    <span class="spacer"></span>
    <span class="ctl"><span id="replayStep" class="hint"></span></span>
    <span class="ctl">player <span id="elev" class="badge low">low</span></span>
  </div>

  <div id="stage" class="stage mode-2d">
    <div id="panel2d" class="panel" data-label="2D"><div id="board"></div></div>
    <div id="colResizer" class="col-resizer" title="Drag to resize"></div>
    <div id="panel3d" class="panel" data-label="3D"><div id="viewport"></div></div>
  </div>

  <!-- replay detail strip (kept "active" so ← → stepping is enabled) -->
  <div id="replayPane" class="pane active">
    <div id="paneResizer" class="row-resizer" title="Drag to resize"></div>
    <div id="replayBoard" style="display:none"></div>
    <div id="replayAction"></div>
    <textarea id="replayThink" readonly placeholder="Agent reasoning will appear here…"></textarea>
    <div class="replay-foot">
      <span id="replayStatus" class="status">No data loaded.</span>
      <span id="replayInfo"></span>
      <span class="spacer"></span>
      <span class="legend">Load a file from <code>mesocosm run export &lt;run-id&gt;</code> · step with <kbd>←</kbd> <kbd>→</kbd></span>
    </div>
  </div>

  <div id="resultPopup" aria-live="polite"></div>

  <script src="maps.js"></script>
  <script src="game.js"></script>
  <script type="module" src="app.js"></script>
  <script src="replay.js"></script>
  <script src="resize.js"></script>
</body>
</html>
